<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Worlds Quest</title>
<meta name="description" content="פלטפורמר פיקסל-ארט: שלי רצה בין עולמות ה-AI — Claude, Higgsfield, Grok ו-OpenAI — אוספת טוקנים, לומדת כל פיצ'ר ונלחמת בסכנות אבטחה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700;900&family=Lora:wght@600;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout: one 16:9 pixel stage, DOM overlays (HUD, toasts, cards) scale with container units. Single deliberate look: sky-blue arcade. */
:root{
  --sky:#2f7fd8; --deep:#0b2f66; --ink:#13213f; --white:#ffffff; --gold:#ffd23f;
  --shelly:#ff4fa6; --shelly2:#ffc6e0;
  --claude:#d97757; --claude-bg:#faf6ee; --claude-ink:#2b2420; --claude-line:#e8dccb;
  --hf:#c8ff2e; --hf-bg:#0c0c10; --hf-ink:#f1f1f1; --hf-line:#2a2d33;
  --pixel:'Lilita One', 'Rubik', 'Arial Black', sans-serif;
  --he:'Rubik', 'Arial Hebrew', Arial, sans-serif;
  --serif:'Lora', Georgia, serif;
  --tech:'Chakra Petch', 'Rubik', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--deep);color:var(--white);overflow:hidden;font-family:var(--he);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1d5fb5,#0b2f66 70%)}
#stage{position:relative;width:min(100vw,calc(100dvh * 16 / 9));aspect-ratio:16/9;max-width:100%;container-type:size;overflow:hidden;background:#000;box-shadow:0 0 0 2px #0a1e44,0 20px 60px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:100%}
.layer{position:absolute;inset:0;pointer-events:none}
.layer > *{pointer-events:auto}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- TITLE ---------- */
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqh;text-align:center;background:radial-gradient(ellipse at 50% 45%,rgba(9,30,80,.45),rgba(9,30,80,.1) 55%,rgba(9,30,80,.35))}
.logo{font-family:var(--pixel);font-size:11cqw;line-height:.88;margin:0;color:#fff;letter-spacing:.01em;-webkit-text-stroke:.07em #ff2f93;paint-order:stroke fill;text-shadow:0 .09em 0 #8a1550,0 .16em .3em rgba(0,0,0,.4)}
.logo small{display:block;font-size:.36em;margin-top:.12em;letter-spacing:.32em;color:#ffd23f;-webkit-text-stroke:.09em #6b3200;text-shadow:0 .12em 0 #6b3200}
.tagline{font-family:var(--he);font-weight:700;font-size:2.6cqw;margin:0;text-shadow:0 .15em .4em rgba(0,0,0,.45)}
.press{font-family:var(--pixel);font-size:2.4cqw;letter-spacing:.08em;color:var(--ink);background:#fff;border:0;border-radius:99px;padding:1.6cqh 3.4cqw;box-shadow:0 .5cqh 0 #a9c8f5;animation:blink 1.2s steps(2) infinite}
.press:hover{transform:translateY(-2px)}
@keyframes blink{50%{opacity:.55}}
.credit{font-family:var(--pixel);font-size:1.3cqw;text-shadow:0 .1em .3em rgba(0,0,0,.5);opacity:.85;letter-spacing:.1em}
#p1card{position:absolute;left:2.5cqw;bottom:4cqh;width:15cqw;background:#fff;color:var(--ink);border-radius:1.2cqw;padding:.7cqw;box-shadow:0 .8cqw 0 #ff4fa6,0 1cqw 2cqw rgba(0,0,0,.35);transform:rotate(-4deg);text-align:left;direction:ltr}
#p1card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 8%;border-radius:.8cqw;background:#f4f4f4}
#p1card b{display:block;font-family:var(--pixel);font-size:1.35cqw;margin:.7cqw 0 .3cqw;color:#ff2f93}
#p1card span{display:block;font-family:var(--pixel);font-size:.95cqw;letter-spacing:.03em;line-height:1.7;color:#4a4a6a}

/* ---------- MAP PANEL ---------- */
#mappanel{position:absolute;left:50%;bottom:2.5cqh;transform:translateX(-50%);width:min(56cqw,100%);background:rgba(255,255,255,.96);color:var(--ink);border-radius:1.4cqw;padding:1.4cqh 1.6cqw;display:flex;align-items:center;gap:1.4cqw;box-shadow:0 .7cqh 0 rgba(10,40,100,.35);direction:rtl}
#mappanel .mp-txt{flex:1;min-width:0}
#mp-name{font-family:var(--pixel);font-size:2.4cqw;margin:0 0 .8cqh;direction:ltr;text-align:right}
#mp-desc{margin:0;font-size:1.45cqw;line-height:1.45;color:#3b4766}
#mp-meta{margin:.6cqh 0 0;font-size:1.2cqw;color:#6a7591;font-weight:500}
#mp-play{font-family:var(--pixel);font-size:1.8cqw;letter-spacing:.05em;border:0;border-radius:99px;padding:1.4cqh 1.8cqw;background:var(--shelly);color:#fff;box-shadow:0 .5cqh 0 #b8236e;white-space:nowrap}
#mp-play[disabled]{background:#c9cfdb;box-shadow:0 .5cqh 0 #9aa3b5;cursor:not-allowed}
#maphint{position:absolute;top:2cqh;letter-spacing:.04em;left:50%;transform:translateX(-50%);font-family:var(--pixel);font-size:1.4cqw;background:rgba(9,40,95,.7);padding:1cqh 1.5cqw;border-radius:99px;white-space:nowrap}
#maptokens{position:absolute;top:2cqh;letter-spacing:.04em;right:2cqw;font-family:var(--pixel);font-size:1.6cqw;background:rgba(9,40,95,.7);padding:1cqh 1.3cqw;border-radius:99px;color:var(--gold)}
#mapback{position:absolute;top:2cqh;letter-spacing:.04em;left:2cqw;font-family:var(--pixel);font-size:1.4cqw;background:rgba(9,40,95,.7);color:#fff;border:0;padding:1cqh 1.3cqw;border-radius:99px}

/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hud > *{pointer-events:none}
.hud-left{position:absolute;top:2cqh;left:1.6cqw;display:flex;gap:.9cqw;align-items:center;direction:ltr}
.face{width:5.2cqw;height:5.2cqw;border-radius:.8cqw;border:.3cqw solid #fff;background:#ff8fcb url(shelly.jpg) 50% 12%/180% auto no-repeat;box-shadow:0 .3cqw 0 rgba(0,0,0,.35)}
.hud-stack{display:flex;flex-direction:column;gap:.6cqh}
#hearts{font-size:2.1cqw;color:#ff3b5c;line-height:1;letter-spacing:.15em;filter:drop-shadow(0 .15cqw 0 rgba(0,0,0,.5))}
.ebar{display:flex;align-items:center;gap:.5cqw;font-family:var(--pixel);font-size:1.05cqw;letter-spacing:.05em;text-shadow:0 .15cqw 0 #000}
.ebar i{display:block;width:11cqw;height:1.4cqh;background:#14213d;border:.2cqw solid #fff;border-radius:99px;overflow:hidden}
.ebar i b{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5dff8a,#c8ff2e);transition:width .1s}
.ebar.low i b{background:linear-gradient(90deg,#ff5d7a,#ffb03b)}
#tok{font-family:var(--pixel);font-size:2.2cqw;color:var(--gold);text-shadow:0 .2cqw 0 #6b4a00,0 0 .6cqw rgba(0,0,0,.4);margin-left:.6cqw}
#slot{width:3.6cqw;height:3.6cqw;border:.25cqw solid #fff;border-radius:.6cqw;background:rgba(20,33,61,.75);display:grid;place-items:center;font-size:1.9cqw;position:relative}
#slot em{position:absolute;bottom:-1.9cqh;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--pixel);font-size:.55cqw;white-space:nowrap;color:#fff;text-shadow:0 .1cqw 0 #000}
.hud-right{position:absolute;top:2cqh;right:1.6cqw;display:flex;gap:.8cqw;align-items:center;direction:ltr}
#cards{font-family:var(--pixel);font-size:1.5cqw;background:rgba(20,33,61,.75);border:.2cqw solid #fff;padding:1cqh 1cqw;border-radius:99px}
#pausebtn{pointer-events:auto;font-family:var(--pixel);font-size:1.6cqw;width:4cqw;height:4cqw;border-radius:50%;border:.2cqw solid #fff;background:rgba(20,33,61,.75);color:#fff;display:grid;place-items:center;padding:0}
#zone{position:absolute;top:10.5cqh;left:1.6cqw;font-family:var(--pixel);font-size:1.1cqw;letter-spacing:.06em;color:#fff;text-shadow:0 .15cqw 0 #000;opacity:.9;direction:ltr}

/* ---------- TOASTS ---------- */
#toasts{position:absolute;top:14cqh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1cqh;width:70cqw;pointer-events:none}
.toast{font-family:var(--he);font-weight:700;font-size:1.55cqw;line-height:1.4;padding:1cqh 1.8cqw;border-radius:1.2cqw;background:rgba(28,16,10,.8);border:.15cqw solid rgba(255,210,63,.55);color:#fff;text-align:center;direction:rtl;box-shadow:0 .4cqh 0 rgba(0,0,0,.35);animation:tin .25s ease-out;max-width:100%}
.toast .en{font-family:var(--pixel);font-size:1.15em;color:#ffd23f;text-transform:uppercase;display:block;margin-bottom:.5cqh;letter-spacing:.05em;direction:ltr}
.toast.warn{background:rgba(70,10,30,.9);border:.2cqw solid #ff5d7a}
.toast.warn .en{color:#ff9db0}
.toast.good .en{color:var(--gold)}
.toast.out{animation:tout .3s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(-1cqh) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-1cqh)}}

/* ---------- MODALS (knowledge cards) ---------- */
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,10,25,.55);padding:3cqh 3cqw}
.card{width:min(64cqw,100%);max-height:92cqh;overflow:auto;border-radius:1.6cqw;padding:2.6cqh 2.4cqw;direction:rtl;text-align:right;box-shadow:0 1.4cqh 0 rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(3cqh);opacity:0}}
.card .kicker{font-family:var(--pixel);font-size:1.2cqw;letter-spacing:.12em;margin:0 0 1.2cqh;display:flex;justify-content:space-between;gap:1cqw}
.card h2{margin:0;font-size:3.2cqw;line-height:1.1;direction:ltr;text-align:right;display:flex;align-items:center;gap:1cqw;justify-content:flex-end;text-wrap:balance}
.card h3{margin:.6cqh 0 1.6cqh;font-size:1.9cqw;font-weight:700}
.card p{margin:0 0 1.4cqh;font-size:1.55cqw;line-height:1.6}
.card ol{margin:0 0 1.4cqh;padding:0 2.2cqw 0 0;font-size:1.45cqw;line-height:1.65}
.card pre{direction:ltr;text-align:left;unicode-bidi:plaintext;margin:0 0 1.6cqh;padding:1.2cqh 1.2cqw;border-radius:.8cqw;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.25cqw;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.card .tip{display:flex;gap:1cqw;align-items:flex-start;border-radius:1cqw;padding:1.2cqh 1.2cqw;font-size:1.45cqw;line-height:1.5;margin-bottom:1.8cqh}
.card .tip b{font-family:var(--pixel);font-size:1.2cqw;white-space:nowrap;padding-top:.5cqh;direction:ltr}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:1cqw}
.card .bonus{font-family:var(--pixel);font-size:1.5cqw}
.card .go{font-family:var(--pixel);font-size:1.6cqw;letter-spacing:.04em;border:0;border-radius:99px;padding:1.4cqh 2cqw}
/* Claude look */
.card.claude{background:var(--claude-bg);color:var(--claude-ink);border:.2cqw solid var(--claude-line)}
.card.claude .kicker{color:var(--claude)}
.card.claude h2{font-family:var(--serif);font-weight:700}
.card.claude h3{color:#6b5a4e}
.card.claude pre{background:#2b2420;color:#f6e7d8}
.card.claude .tip{background:#f3e3d3;color:#5a3b28}
.card.claude .tip b{color:var(--claude)}
.card.claude .bonus{color:#b5651d}
.card.claude .go{background:var(--claude);color:#fff;box-shadow:0 .5cqh 0 #a2502f}
/* Higgsfield look */
.card.hf{background:var(--hf-bg);color:var(--hf-ink);border:.2cqw solid var(--hf-line)}
.card.hf .kicker{color:var(--hf)}
.card.hf h2{font-family:var(--tech);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.card.hf h3{color:#b9bcc4}
.card.hf pre{background:#1b1d22;color:var(--hf);border:1px solid #2f333a}
.card.hf .tip{background:#171a12;color:#e6ffb0;border:1px solid #3a4a12}
.card.hf .tip b{color:var(--hf)}
.card.hf .bonus{color:var(--hf)}
.card.hf .go{background:var(--hf);color:#0c0c10;box-shadow:0 .5cqh 0 #7a9c12}
/* threat card + complete + pause share neutral look */
.card.sys{background:#fff;color:var(--ink);border:.3cqw solid #13213f}
.card.sys h2{font-family:var(--pixel);font-size:3.2cqw;justify-content:center;text-align:center}
.card.sys .go{background:var(--shelly);color:#fff;box-shadow:0 .5cqh 0 #b8236e}
.card.sys .go.alt{background:#e7ecf5;color:var(--ink);box-shadow:0 .5cqh 0 #b3bccd}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw;margin:2cqh 0}
.stats div{background:#f1f5fc;border-radius:1cqw;padding:1.4cqh .6cqw;text-align:center}
.stats b{display:block;font-family:var(--pixel);font-size:2.4cqw;margin-bottom:.8cqh;font-variant-numeric:tabular-nums}
.stats span{font-size:1.2cqw;color:#5b6784}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.8cqh 1.4cqw;font-size:1.4cqw;margin:1.6cqh 0 2cqh;align-items:center}
.keys kbd{font-family:var(--pixel);font-size:1.25cqw;background:#13213f;color:#fff;border-radius:.5cqw;padding:.8cqh .8cqw;direction:ltr;text-align:center}
.btnrow{display:flex;gap:1cqw;justify-content:center;flex-wrap:wrap}

/* ---------- TOUCH ---------- */
#touch{display:none}
.touch #touch{display:block}
.tbtn{position:absolute;bottom:4cqh;width:10cqh;height:10cqh;border-radius:50%;border:.4cqh solid rgba(255,255,255,.85);background:rgba(20,33,61,.45);color:#fff;font-family:var(--pixel);font-size:4cqh;display:grid;place-items:center;touch-action:none;padding:0}
.tbtn.on{background:rgba(255,79,166,.6)}
#t-left{left:3cqw}#t-right{left:calc(3cqw + 12cqh)}
#t-throw{right:calc(3cqw + 12cqh);bottom:4cqh}#t-jump{right:3cqw;bottom:9cqh;width:12cqh;height:12cqh}
#rotate{display:none;position:fixed;inset:auto 0 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:700;background:#ff4fa6;color:#fff;z-index:5}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:block}}
@media (prefers-reduced-motion:reduce){.press{animation:none}.toast,.card{animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="960" height="540" aria-label="AI Worlds game screen"></canvas>

    <div id="title" class="layer">
      <h1 class="logo">AI WORLDS<small>QUEST</small></h1>
      <p class="tagline" dir="rtl">רוצי בין עולמות ה-AI. אספי טוקנים. תלמדי הכל.</p>
      <button class="press" id="startbtn">PRESS START</button>
      <div class="credit">SHELLY OR GISSER · AI.GOS</div>
      <div id="p1card" aria-hidden="true">
        <img src="shelly.jpg" alt="">
        <b>PLAYER 1 · SHELLY</b>
        <span>CLASS: CREATIVE DIRECTOR<br>POWER: PROMPT MAGIC<br>WEAKNESS: NONE</span>
      </div>
    </div>

    <div id="mapui" class="layer" hidden>
      <button id="mapback">◀ TITLE</button>
      <div id="maphint">◀ ▶ בחרי עולם · ENTER להיכנס</div>
      <div id="maptokens">◆ 0</div>
      <div id="mappanel">
        <div class="mp-txt">
          <h2 id="mp-name">CLAUDE</h2>
          <p id="mp-desc"></p>
          <p id="mp-meta"></p>
        </div>
        <button id="mp-play">▶ PLAY</button>
      </div>
    </div>

    <div id="hud" class="layer" hidden>
      <div class="hud-left">
        <div class="face"></div>
        <div class="hud-stack">
          <div id="hearts">❤❤❤❤</div>
          <div class="ebar" id="ebar"><span id="ename">CONTEXT</span><i><b id="ebarfill"></b></i></div>
        </div>
        <div id="tok">◆ x000</div>
        <div id="slot">·<em id="slotname"></em></div>
      </div>
      <div class="hud-right">
        <div id="cards">📘 0/0</div>
        <button id="pausebtn" aria-label="Pause">II</button>
      </div>
      <div id="zone"></div>
    </div>

    <div id="toasts" class="layer"></div>
    <div id="modal" class="layer modal" hidden></div>

    <div id="touch" class="layer" hidden>
      <button class="tbtn" id="t-left" aria-label="Left">◀</button>
      <button class="tbtn" id="t-right" aria-label="Right">▶</button>
      <button class="tbtn" id="t-throw" aria-label="Throw">B</button>
      <button class="tbtn" id="t-jump" aria-label="Jump">A</button>
    </div>
  </div>
</div>
<div id="rotate">סובבי את הטלפון לרוחב כדי לשחק 📱↻</div>

<script>
(()=>{
'use strict';
/* =========================================================
   CORE (smooth, DPR-aware canvas; logical 480x270)
   ========================================================= */
const W=480,H=270,T=16;
const cv=document.getElementById('cv');
const main=cv.getContext('2d');
let X=main,K=2;
const GF="'Lilita One', 'Rubik', 'Arial Black', sans-serif";
function fit(){const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);const w=Math.max(480,Math.min(1920,Math.round((r.width||960)*dpr)));if(cv.width!==w){cv.width=w;cv.height=Math.round(w*9/16);}K=cv.width/W;}
addEventListener('resize',fit);
function setMain(){X=main;X.setTransform(K,0,0,K,0,0);X.imageSmoothingEnabled=true;X.imageSmoothingQuality='high';X.globalAlpha=1;X.filter='none';X.shadowBlur=0;}
function R(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h);}
function rr(x,y,w,h,r){X.beginPath();if(X.roundRect)X.roundRect(x,y,w,h,r);else X.rect(x,y,w,h);}
function circ(x,y,r,c){X.beginPath();X.arc(x,y,Math.max(.1,r),0,Math.PI*2);X.fillStyle=c;X.fill();}
function oval(x,y,rx,ry,c){X.beginPath();X.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);X.fillStyle=c;X.fill();}
function lin(x0,y0,x1,y1,st){const g=X.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g;}
function rad(x,y,r,st){const g=X.createRadialGradient(x,y,0,x,y,Math.max(.1,r));st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g;}
function glow(x,y,r,rgb,a){X.globalAlpha=a==null?1:a;circ(x,y,r,rad(x,y,r,['rgba('+rgb+',1)','rgba('+rgb+',.35)','rgba('+rgb+',0)']));X.globalAlpha=1;}
function starPath(cx,cy,r1,r2,n){X.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=-Math.PI/2+i*Math.PI/n;X.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}X.closePath();}
function txt(s,x,y,size,c,align,stroke){X.font=(size||7)+'px '+GF;X.textAlign=align||'left';X.textBaseline='middle';if(stroke){X.lineWidth=size/3;X.strokeStyle=stroke;X.lineJoin='round';X.strokeText(s,x,y);}X.fillStyle=c||'#fff';X.fillText(s,x,y);}
function txtW(s,size){X.font=(size||7)+'px '+GF;return X.measureText(s).width;}
function pill(s,cx,y,bg,fg,size){size=size||6;const w=txtW(s,size)+size*1.5,h=size*1.75;rr(cx-w/2,y-h/2,w,h,h/2);X.fillStyle=bg;X.fill();txt(s,cx,y+size*.06,size,fg,'center');}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);

/* =========================================================
   INPUT
   ========================================================= */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyX:'throw',KeyJ:'throw',KeyK:'throw',ShiftLeft:'throw',Enter:'enter',Escape:'pause',KeyP:'pause',KeyM:'mute'};

/* =========================================================
   LEVEL BUILDER
   ========================================================= */
class LB{
  constructor(){this.x=0;this.h=3;this.solids=[];this.plats=[];this.ents=[];this.coins=[];this.spawn={x:40,y:100};}
  gy(){return H-this.h*T;}
  at(dx,dy){return{x:this.x+dx*T,y:this.gy()-(dy||0)*T};}
  flat(n,coins){this.solids.push({x:this.x,y:this.gy(),w:n*T,h:this.h*T+40});if(coins){for(let i=2;i<n-1;i+=2)this.coins.push({x:this.x+i*T+4,y:this.gy()-22});}this.x+=n*T;return this;}
  gap(n){this.x+=n*T;return this;}
  up(n){this.h+=n;return this;}
  down(n){this.h-=n;return this;}
  plat(dx,dy,w,move){const p=this.at(dx,dy);this.plats.push({x:p.x,y:p.y,w:w*T,h:7,ox:p.x,oy:p.y,move:move||null,dx:0,dy:0});return this;}
  coinLine(dx,dy,n){for(let i=0;i<n;i++){const p=this.at(dx+i,dy);this.coins.push({x:p.x+4,y:p.y-10});}return this;}
  coinArc(dx,dy,n){for(let i=0;i<n;i++){const a=i/(n-1);const p=this.at(dx+i,dy);this.coins.push({x:p.x+4,y:p.y-10-Math.sin(a*Math.PI)*28});}return this;}
  e(type,dx,dy){const p=this.at(dx,dy||0);this.ents.push({k:'enemy',type,x:p.x,y:p.y-18});return this;}
  card(id,dx,dy){const p=this.at(dx,dy);this.ents.push({k:'card',id,x:p.x+2,y:p.y-18});return this;}
  check(dx){const p=this.at(dx,0);this.ents.push({k:'check',x:p.x,y:p.y});return this;}
  spring(dx){const p=this.at(dx,0);this.ents.push({k:'spring',x:p.x+1,y:p.y-8});return this;}
  power(kind,dx,dy){const p=this.at(dx,dy);this.ents.push({k:'power',kind,x:p.x+1,y:p.y-16});return this;}
  spikes(dx,n){const p=this.at(dx,0);this.ents.push({k:'spikes',x:p.x,y:p.y-6,w:n*T});return this;}
  sign(dx,title,he){const p=this.at(dx,0);this.ents.push({k:'sign',x:p.x,y:p.y,title,he});return this;}
  portal(dx){const p=this.at(dx,0);this.ents.push({k:'portal',x:p.x,y:p.y-48});return this;}
  pit(type,dx){const p=this.at(dx,0);this.ents.push({k:'enemy',type,x:p.x,y:H+30});return this;}
  done(){this.solids.push({x:-40,y:-200,w:40,h:600});this.solids.push({x:this.x,y:-200,w:40,h:600});return{solids:this.solids,plats:this.plats,ents:this.ents,coins:this.coins,width:this.x,spawn:this.spawn};}
}

// Shelly cut-out puppet: body + two legs swinging from the hips
function drawHero(cx,fy,dir,st,t,sc){
  const im=ART.hero;if(!im)return;sc=sc||1;const s=50/230*sc;
  let aL=0,aR=0,bob=0,lean=0,sy=1,sx=1;
  if(st==='run'){const ph=t*.3;aL=Math.sin(ph)*.6;aR=-aL;bob=-Math.abs(Math.cos(ph))*1.6;lean=.09;}
  else if(st==='jump'){aL=-.55;aR=.3;sy=1.04;sx=.97;lean=.04;}
  else if(st==='fall'){aL=.3;aR=-.35;}
  else if(st==='throw'){lean=.16;aL=-.25;aR=.15;}
  else if(st==='charge'){lean=-.1;sy=.97;sx=1.03;}
  else{sy=1+Math.sin(t*.07)*.012;}
  X.save();X.translate(cx,fy+bob);X.scale(dir*sx,sy);X.rotate(lean);X.scale(s,s);
  const leg=(sx0,lx,px,a)=>{X.save();X.translate(lx+px,-92.5+6);X.rotate(a);X.drawImage(im,sx0,0,50,92,-px,-6,50,92);X.restore();};
  leg(104,-50,40,aL);leg(158,0,12,aR);
  X.drawImage(im,0,0,100,147,-50,-230,100,147);
  X.restore();
}
function drawEnemy(e,t){
  const sp=SPR[e.type],im=ART[sp[0]];if(!im)return;const dh=EDH[e.type],dw=sp[2]*dh/128;
  const cx=e.x+e.w/2,fy=e.y+e.h;let bob=0,rot=0,sy=1,sx=1;
  if(e.beh==='walk'){bob=-Math.abs(Math.sin(t*.22+e.ph))*2;rot=Math.sin(t*.22+e.ph)*.07;}
  else if(e.beh==='hop'){if(e.onGround){sy=.9;sx=1.08;}else{sy=1.08;sx=.94;}}
  else if(e.beh==='float'){rot=Math.sin(t*.05+e.ph)*.08;}
  else if(e.beh==='pit'){rot=e.vy<0?-.5:.5;}
  if((e.beh==='walk'||e.beh==='hop')&&e.onGround)oval(cx,fy,dw*.36,2.2,'rgba(0,0,0,.3)');
  X.save();X.translate(cx,fy+bob);X.scale((e.dir>0?-1:1)*sx,sy);X.rotate(rot);
  if(e.flash>0&&(e.flash>>1)%2)X.filter='brightness(2.3) saturate(.4)';
  X.drawImage(im,sp[1],0,sp[2],128,-dw/2,-dh,dw,dh);X.filter='none';X.restore();
  if(e.type==='troll')for(let i=0;i<e.hp;i++)circ(cx-6+i*6,fy-dh-3,2.2,'#ff4f6a');
}
function plate(img,off,alpha){if(!img)return;X.globalAlpha=alpha;const w=H*img.width/img.height;const i0=Math.floor(off/w);
  for(let i=i0;i<=i0+Math.ceil(W/w)+1;i++){const x=i*w-off;if(((i%2)+2)%2){X.save();X.translate(x+w,0);X.scale(-1,1);X.drawImage(img,0,0,w,H);X.restore();}else X.drawImage(img,x,0,w,H);}X.globalAlpha=1;}

/* ---------- physics helpers ---------- */
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function solidAt(x,y){for(const s of lvl.solids)if(x>=s.x&&x<s.x+s.w&&y>=s.y&&y<s.y+s.h)return true;for(const p of lvl.plats)if(x>=p.x&&x<p.x+p.w&&y>=p.y&&y<p.y+p.h)return true;return false;}
function moveBody(b){
  b.hitWall=false;b.x+=b.vx;
  for(const s of lvl.solids)if(ov(b,s)){if(b.vx>0)b.x=s.x-b.w;else if(b.vx<0)b.x=s.x+s.w;else{b.x=(b.x+b.w/2<s.x+s.w/2)?s.x-b.w:s.x+s.w;}b.vx=0;b.hitWall=true;}
  const pb=b.y+b.h;b.y+=b.vy;b.onGround=false;b.plat=null;
  for(const s of lvl.solids)if(ov(b,s)){if(b.vy>0){b.y=s.y-b.h;b.onGround=true;}else if(b.vy<0)b.y=s.y+s.h;b.vy=0;}
  if(b.vy>=0)for(const p of lvl.plats){if(b.x+b.w>p.x&&b.x<p.x+p.w&&pb<=p.y+Math.max(0,p.dy)+1.5&&b.y+b.h>=p.y){b.y=p.y-b.h;b.vy=0;b.onGround=true;b.plat=p;}}
}

/* ---------- level update ---------- */
function updateLevel(){
  const L=lvl,p=player,Wd=L.def;L.t++;p.t++;if(L.fade<1)L.fade=Math.min(1,L.fade+.02);
  for(const m of L.plats){if(m.move){const ox=m.x,oy=m.y;const s=Math.sin(L.t*m.move.speed+m.move.ph);if(m.move.axis==='x')m.x=m.ox+s*m.move.range;else m.y=m.oy+s*m.move.range;m.dx=m.x-ox;m.dy=m.y-oy;}}
  // input → movement
  const acc=p.onGround?.34:.24,max=2.3;
  if(I.left&&!I.right){p.vx-=acc;p.dir=-1;}else if(I.right&&!I.left){p.vx+=acc;p.dir=1;}else p.vx*=p.onGround?.72:.93;
  p.vx=clamp(p.vx,-max,max);if(Math.abs(p.vx)<.05)p.vx=0;
  if(I.jumpP)p.jbuf=8;else if(p.jbuf>0)p.jbuf--;
  if(p.onGround)p.coy=7;else if(p.coy>0)p.coy--;
  if(p.jbuf>0&&p.coy>0){p.vy=-6.7;p.jbuf=0;p.coy=0;p.onGround=false;sfx('jump');puff(p.x+p.w/2,p.y+p.h,'#ffffff',4);}
  if(p.springT>0)p.springT--;
  if(!I.jump&&p.vy<-2.6&&p.springT<=0)p.vy=-2.6;
  p.vy=Math.min(p.vy+.33,7.2);
  if(p.plat){p.x+=p.plat.dx;p.y+=p.plat.dy;}
  moveBody(p);
  if(p.x<0)p.x=0;
  // throw / charge
  const boost=p.power&&p.power.kind==='boost';
  if(I.throwP){p.charging=true;p.charge=0;}
  if(p.charging&&I.throw){p.charge++;if(p.charge%5===0&&p.charge>=20)L.parts.push({x:p.x+p.w/2+p.dir*6+rnd(-6,6),y:p.y+4+rnd(-4,4),vx:0,vy:-.4,life:16,c:Wd.id==='claude'?'#ffb27a':'#c8ff2e',s:2});}
  if(p.charging&&!I.throw){const big=boost||(p.charge>=34&&p.energy>=25);const cost=boost?0:big?25:8;
    if(p.energy>=cost){p.energy-=cost;fire(big);}else toast(Wd.energy+' LOW','אין מספיק '+(Wd.id==='claude'?'קונטקסט':'קרדיטים')+'. חכי רגע שיתמלא','warn',1600);
    p.charging=false;p.charge=0;}
  p.energy=Math.min(100,p.energy+.14);
  if(p.throwT>0)p.throwT--;
  if(p.inv>0)p.inv--;
  if(p.power){p.power.t--;if(p.power.t<=0){toast(p.power.name+' OFF','הכוח נגמר','',1400);p.power=null;}}
  // pit
  if(p.y>H+30){hurt(true);}
  // camera
  const target=p.x+p.w/2-W*.4+p.dir*20;cam+=(target-cam)*.1;cam=clamp(cam,0,L.width-W);
  // zones (signs)
  for(const e of L.ents){if(e.k==='sign'&&!e.hit&&p.x>e.x-10){e.hit=true;L.zone=e.title;if(e.zi!==L.zoneIdx){L.prevZone=L.zoneIdx;L.zoneIdx=e.zi;L.fade=0;}toast('ZONE · '+e.title,e.he,'good',2600);}}
  // shots
  for(const s of L.shots){s.x+=s.vx;s.y+=s.vy;if(!s.big)s.vy+=.04;s.life--;if(s.life<=0||solidAt(s.x,s.y)){s.dead=true;puff(s.x,s.y,s.c,4);}}
  // enemies
  for(const e of L.ents){if(e.k!=='enemy'||!e.alive)continue;updateEnemy(e,p);}
  // orbit helpers
  if(p.power&&p.power.kind==='orbit'){L.orbit+=.09;for(let k=0;k<2;k++){const ox=p.x+p.w/2+Math.cos(L.orbit+k*Math.PI)*20,oy=p.y+14+Math.sin(L.orbit+k*Math.PI)*12;for(const e of L.ents)if(e.k==='enemy'&&e.alive&&ov({x:ox-4,y:oy-4,w:8,h:8},e))damage(e,3);}}
  // coins
  const pr={x:p.x,y:p.y,w:p.w,h:p.h};
  for(const c of L.coins){if(!c.got&&ov(pr,{x:c.x,y:c.y,w:8,h:8})){c.got=true;addTokens(10,c.x+4,c.y);sfx('coin');}}
  // entities
  for(const e of L.ents){
    if(e.k==='card'&&!e.got&&ov(pr,{x:e.x,y:e.y,w:12,h:16})){e.got=true;collectCard(e);}
    else if(e.k==='check'&&!e.on&&ov(pr,{x:e.x,y:e.y-34,w:14,h:34})){e.on=true;L.checkpoint={x:e.x,y:e.y-40};p.hearts=4;sfx('check');toast('CHECKPOINT · '+Wd.check,Wd.checkMsg,'good',2200);burst(e.x+7,e.y-30,'#ffd23f',14);}
    else if(e.k==='spring'&&p.vy>0&&ov(pr,{x:e.x,y:e.y,w:14,h:8})){p.vy=-10.5;p.springT=30;e.sq=10;sfx('spring');}
    else if(e.k==='power'&&!e.got&&ov(pr,{x:e.x,y:e.y,w:14,h:14})){e.got=true;const pw=Wd.powers[e.kind];p.power={...pw,t:pw.kind==='orbit'?900:720,max:pw.kind==='orbit'?900:720};sfx('power');toast('POWER UP · '+pw.name,pw.he,'good',2600);burst(e.x+7,e.y+7,'#ff4fa6',18);}
    else if(e.k==='spikes'&&ov(pr,{x:e.x+2,y:e.y,w:e.w-4,h:6})){hurt(false);}
    else if(e.k==='portal'&&!L.done&&ov(pr,{x:e.x+8,y:e.y,w:24,h:48})){L.done=true;completeLevel();}

  for(const q of L.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g||0;q.life--;}
  for(const q of L.pops){q.y-=.5;q.life--;}

}
function fire(big){const p=player,L=lvl;p.throwT=12;const c=L.def.id==='claude'?'#ff8a4c':'#c8ff2e';
  L.shots.push({x:p.x+p.w/2+p.dir*8,y:p.y+10,vx:p.dir*(big?5:4.2),vy:big?0:-1.1,life:big?70:46,big,c,r:big?6:3});sfx(big?'big':'shot');}
function updateEnemy(e,p){
  const L=lvl;if(e.flash>0)e.flash--;if(e.cool>0)e.cool--;
  if(Math.abs(e.x-p.x)>W*1.1&&e.beh!=='float')return;
  if(e.beh==='walk'){e.vx=e.dir*e.sp;e.vy=Math.min(e.vy+.33,7);moveBody(e);if(e.hitWall)e.dir*=-1;else if(e.onGround){const fx=e.dir>0?e.x+e.w+1:e.x-1;if(!solidAt(fx,e.y+e.h+3))e.dir*=-1;}if(Math.abs(e.x-e.home)>110){e.dir=e.x>e.home?-1:1;}}

}
function damage(e,n){if(!e.alive||e.flash>0&&n<3)return;e.hp-=n;e.flash=10;if(e.hp<=0){e.alive=false;lvl.stats.threats++;burst(e.x+8,e.y+8,'#ffffff',12);burst(e.x+8,e.y+8,'#ff4fa6',8);addTokens(25,e.x+8,e.y-4);sfx('kill');}else sfx('stomp');}

/* ---------- level draw (cinematic) ---------- */
const DUST=Array.from({length:26},()=>({x:rnd(0,W+60),y:rnd(0,H),r:rnd(.6,2.4),s:rnd(.6,1.6),ph:rnd(0,6)}));

/* =========================================================
   DOM: HUD, toasts, modals
   ========================================================= */
let lastHud={};
function updateHud(){
  const p=player,L=lvl;const total=cardsOf(L.def.id).length;const learned=cardsOf(L.def.id).filter(k=>save.learned[k]).length;
  const v={h:p.hearts,e:Math.round(p.energy),tk:L.stats.tokens,pw:p.power?p.power.icon+Math.ceil(p.power.t/60):'',c:learned+'/'+total,z:L.zone};
  if(v.h!==lastHud.h)$('hearts').textContent='❤'.repeat(Math.max(0,v.h))+'♡'.repeat(Math.max(0,4-v.h));
  if(v.e!==lastHud.e){$('ebarfill').style.width=v.e+'%';$('ebar').classList.toggle('low',v.e<25);}
  if(v.tk!==lastHud.tk)$('tok').textContent='◆ x'+String(v.tk).padStart(3,'0');
  if(v.pw!==lastHud.pw){$('slot').firstChild.textContent=p.power?p.power.icon:'·';$('slotname').textContent=p.power?p.power.name+' '+Math.ceil(p.power.t/60)+'s':'';}
  if(v.c!==lastHud.c)$('cards').textContent='📘 '+v.c;
  if(v.z!==lastHud.z)$('zone').textContent=v.z?'ZONE · '+v.z:'';
  lastHud=v;
}
function toast(en,he,kind,ms){const box=$('toasts');while(box.children.length>=2)box.firstChild.remove();const d=document.createElement('div');d.className='toast '+(kind||'');
  const e=document.createElement('span');e.className='en';e.textContent=en;const h=document.createElement('span');h.textContent=he;d.append(e,h);box.append(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),320);},ms||2500);}
function clearToasts(){$('toasts').innerHTML='';}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function openModal(html,onClose){const m=$('modal');m.innerHTML=html;m.hidden=false;modalOpen=true;modalAt=performance.now();modalClose=onClose||null;
  m.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>handleAct(b.dataset.act)));const f=m.querySelector('.go');if(f)f.focus({preventScroll:true});}
function closeModal(){const m=$('modal');m.hidden=true;m.innerHTML='';modalOpen=false;const cb=modalClose;modalClose=null;for(const k in held)held[k]=false;if(cb)cb();}
function collectCard(e){const c=CARDS[e.id];const first=!save.learned[e.id];save.learned[e.id]=true;persist();lvl.stats.cards++;addTokens(first?100:20,e.x+6,e.y);sfx('card');burst(e.x+6,e.y+8,lvl.def.id==='claude'?'#d97757':'#c8ff2e',16);
  const total=cardsOf(lvl.def.id).length,learned=cardsOf(lvl.def.id).filter(k=>save.learned[k]).length;
  const html=`<div class="card ${lvl.def.cardClass}" role="dialog" aria-modal="true" aria-label="${esc(c.title)}">
    <p class="kicker" dir="ltr"><span>KNOWLEDGE CARD ${learned}/${total}</span><span>${lvl.def.name}</span></p>
    <h2>${esc(c.title)} <span aria-hidden="true">${c.icon}</span></h2>
    <h3>${esc(c.he)}</h3>
    <p>${esc(c.what)}</p>
    <ol>${c.how.map(s=>'<li>'+esc(s)+'</li>').join('')}</ol>
    ${c.code?'<pre>'+esc(c.code)+'</pre>':''}
    <div class="tip"><b>PRO TIP</b><span>${esc(c.tip)}</span></div>
    <div class="row"><span class="bonus" dir="ltr">${first?'+100 ◆ NEW!':'+20 ◆'}</span><button class="go" data-act="close">המשך ▶</button></div></div>`;
  paused=true;openModal(html,()=>{paused=false;player.inv=Math.max(player.inv,40);});
}
function completeLevel(){const L=lvl,id=L.def.id;sfx('win');
  save.tokens+=L.stats.tokens;save.cleared[id]=true;if(id==='claude')save.unlocked.higgs=true;save.best[id]=Math.max(save.best[id]||0,L.stats.tokens);persist();
  const secs=Math.round((performance.now()-L.stats.start)/1000);const total=cardsOf(id).length,learned=cardsOf(id).filter(k=>save.learned[k]).length;
  const next=id==='claude'?'<p style="text-align:center;margin:0 0 2cqh">🔓 <b>HIGGSFIELD</b> נפתח במפה!</p>':'<p style="text-align:center;margin:0 0 2cqh">GROK, OPENAI ו-GEMINI מגיעים בקרוב. 👀</p>';
  paused=true;
  openModal(`<div class="card sys" role="dialog" aria-modal="true" aria-label="World clear"><h2>${L.def.portal}! WORLD CLEAR ★</h2>
    <div class="stats"><div><b>${L.stats.tokens}</b><span>טוקנים</span></div><div><b>${learned}/${total}</b><span>כרטיסי ידע</span></div><div><b>${L.stats.threats}</b><span>איומים נוטרלו</span></div><div><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>זמן</span></div></div>
    ${next}<div class="btnrow"><button class="go" data-act="map">למפה ▶</button><button class="go alt" data-act="retry">שחקי שוב</button></div></div>`);
}
function showPause(){if(scene!=='level'||modalOpen)return;paused=true;
  openModal(`<div class="card sys" role="dialog" aria-modal="true" aria-label="Pause"><h2>PAUSE</h2>
   <div class="keys"><kbd>← →</kbd><span>ריצה (A/D)</span><kbd>SPACE ↑</kbd><span>קפיצה. מחזיקים = גבוה יותר</span><kbd>X (J/K)</kbd><span>החזיקי לטעינה, שחררי לזריקה. טעונה = חודרת וחזקה</span><kbd>STOMP</kbd><span>קפיצה על איום מנטרלת אותו</span><kbd>M</kbd><span>שקט / צליל</span></div>
   <div class="btnrow"><button class="go" data-act="close">המשך ▶</button><button class="go alt" data-act="map">למפה</button><button class="go alt" data-act="mute">${muted?'🔇 צליל כבוי':'🔊 צליל פועל'}</button></div></div>`,()=>{paused=false;});}
function handleAct(a){
  if(a==='close')closeModal();
  else if(a==='map'){closeModal();goMap();}
  else if(a==='retry'){const id=lvl.def.id;closeModal();startLevel(id);}
  else if(a==='mute'){muted=!muted;const b=$('modal').querySelector('[data-act="mute"]');if(b)b.textContent=muted?'🔇 צליל כבוי':'🔊 צליל פועל';}
}

/* =========================================================
   SCENES
   ========================================================= */
function goTitle(){scene='title';$('title').hidden=false;$('mapui').hidden=true;$('hud').hidden=true;$('touch').hidden=true;clearToasts();$('startbtn').focus({preventScroll:true});}
function goMap(){scene='map';paused=false;$('title').hidden=true;$('mapui').hidden=false;$('hud').hidden=true;$('touch').hidden=true;clearToasts();delete document.body.dataset.world;updateMapPanel();}
function updateMapPanel(){const id=MAP_ORDER[mapSel],w=WORLDS[id];const open=!w.locked&&save.unlocked[id];
  $('mp-name').textContent=w.name;$('mp-name').style.color=id==='higgs'?'#5a7a00':id==='grok'?'#222':w.color;
  $('mp-desc').textContent=w.desc;
  if(w.locked)$('mp-meta').textContent='🔒 COMING SOON';
  else if(!open)$('mp-meta').textContent='🔒 סיימי את עולם Claude כדי לפתוח';
  else{const ks=cardsOf(id),l=ks.filter(k=>save.learned[k]).length;$('mp-meta').textContent='📘 '+l+'/'+ks.length+' כרטיסי ידע · שיא: '+(save.best[id]||0)+' ◆'+(save.cleared[id]?' · ★ הושלם':'');}
  const b=$('mp-play');b.disabled=!open;b.textContent=open?'▶ PLAY':'🔒 SOON';
  $('maptokens').textContent='◆ '+save.tokens;}
function enterSelected(){const id=MAP_ORDER[mapSel],w=WORLDS[id];if(!w.locked&&save.unlocked[id])startLevel(id);else{sfx('hit');toast(w.name,w.locked?'העולם הזה עוד בבנייה. בקרוב!':'סיימי קודם את עולם Claude','warn',1800);}}
function updateMap(){mapT++;FLYERS.forEach(f=>{f.x+=f.vx;if(f.x>W+30)f.x=-30;if(f.x<-30)f.x=W+30;});
  if(I.rightP){mapSel=(mapSel+1)%MAP_ORDER.length;sfx('coin');updateMapPanel();}
  if(I.leftP){mapSel=(mapSel+MAP_ORDER.length-1)%MAP_ORDER.length;sfx('coin');updateMapPanel();}
  if(I.enterP||I.jumpP)enterSelected();}

$('startbtn').addEventListener('click',()=>{unlockAudio();sfx('start');goMap();});
$('mapback').addEventListener('click',goTitle);
$('mp-play').addEventListener('click',()=>{unlockAudio();enterSelected();});
$('pausebtn').addEventListener('click',showPause);
cv.addEventListener('click',ev=>{if(scene!=='map')return;const r=cv.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
  let best=-1,bd=1e9;ISLANDS.forEach(I=>{const d=Math.hypot(I.x-x,(I.y-y)*1.3);if(d<I.r&&d<bd){bd=d;best=MAP_ORDER.indexOf(I.id);}});
  if(best>=0){if(best===mapSel)enterSelected();else{mapSel=best;sfx('coin');updateMapPanel();}}});
function onAnyKey(e){unlockAudio();
  if(modalOpen){if((e.code==='Enter'||e.code==='Space'||e.code==='KeyX'||e.code==='Escape')&&performance.now()-modalAt>350){e.preventDefault();const m=$('modal');if(m.querySelector('[data-act="close"]'))closeModal();else if(e.code==='Enter'){const g=m.querySelector('.go');if(g)g.click();}}return;}
  if(scene==='title'&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();sfx('start');goMap();latch.enter=latch.jump=false;prev.enter=prev.jump=true;}
  else if(scene==='level'&&(e.code==='Escape'||e.code==='KeyP'))showPause();
  else if(e.code==='KeyM'){muted=!muted;}
}

/* =========================================================
   LOOP
   ========================================================= */
let acc=0,last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){pollInput();
    if(scene==='level'&&!paused)updateLevel();
    else if(scene==='map'||scene==='title'){updateMap0();}
    acc-=1000/60;}
  if(scene==='level'){drawLevel();updateHud();}else drawMap();
  requestAnimationFrame(frame);
}
function updateMap0(){if(scene==='map')updateMap();else{mapT++;FLYERS.forEach(f=>{f.x+=f.vx;if(f.x>W+30)f.x=-30;if(f.x<-30)f.x=W+30;});}}

function boot(){fit();initFlyers();
  const w=qs.get('world');if(w&&WORLDS[w]&&!WORLDS[w].locked&&save.unlocked[w]){startLevel(w);}else goTitle();
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});}
Promise.all([loadArt(),document.fonts&&document.fonts.load?Promise.all([document.fonts.load("16px 'Lilita One'"),document.fonts.load("16px Rubik")]).catch(()=>{}):0]).then(boot);
})();
</script>
