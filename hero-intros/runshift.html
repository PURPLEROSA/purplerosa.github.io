<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runshift Hero · Hero Intro Template</title>
<meta name="description" content="Hero intro template: vibrant game hero, glass nav drops in, scroll-driven runner video swaps worlds and slides. Part of PURPLEROSA Hero Intros.">
<script>document.documentElement.classList.add('hi-js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,900;1,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero-intro.css">
<!--
  RUNSHIFT · "Forward motion, world shift"
  Mode: SCRUB. Auto intro 0 → 1.75s: glass nav drops → slide 1 slams in.
  Scroll = the runner keeps running; the world (track → desert) and the slides change with it.
-->
<style>
:root{--rs-sky:#2ab3d6;--rs-violet:#6b3fd1;--rs-magenta:#e2336b;--rs-orange:#ff8a2a;--rs-sun:#ffd34d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#1b0f2e;color:#fff}
.rs .hi-stage{background:linear-gradient(180deg,var(--rs-sky) 0%,#7fd6e8 40%,#ffc89a 52%)}
/* stand-in world: perspective track + speed lines; hue shifts with scroll (track → desert) */
.rs-world{position:absolute;inset:0;filter:hue-rotate(calc(var(--p)*38deg)) saturate(calc(1 + var(--p)*.3))}
.rs-cloud{position:absolute;border-radius:50%;background:#fff;filter:blur(2px);box-shadow:60px 10px 0 -10px #fff,120px 0 0 -20px #fff}
.rs-floor{position:absolute;left:-50%;right:-50%;top:50%;bottom:-20%;transform:perspective(500px) rotateX(62deg);transform-origin:50% 0;
  background:repeating-linear-gradient(90deg,transparent 0 11%,rgba(255,255,255,.75) 11% 11.4%),repeating-linear-gradient(0deg,var(--rs-magenta) 0 60px,#f0517e 60px 120px);
  animation:rs-run .5s linear infinite}
@keyframes rs-run{to{background-position:0 0,0 120px}}
.rs-speed{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 52%,rgba(255,255,255,.0) 0 3deg,rgba(255,255,255,.35) 3deg 3.4deg);
  -webkit-mask:radial-gradient(circle at 50% 52%,transparent 22%,#000 60%);mask:radial-gradient(circle at 50% 52%,transparent 22%,#000 60%);animation:rs-spin 3s linear infinite;opacity:.6}
@keyframes rs-spin{to{transform:rotate(3deg)}}
.rs-portal{position:absolute;left:50%;top:50%;width:30vw;height:30vw;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,#fff 0 8%,var(--rs-sun) 18%,rgba(255,138,42,.5) 45%,transparent);filter:blur(6px);animation:rs-pulse .9s ease-in-out infinite alternate}
@keyframes rs-pulse{to{transform:scale(1.12)}}
.rs-nav{position:absolute;top:18px;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.rs-logo{font-family:Archivo;font-weight:900;font-size:14px;display:flex;gap:6px;align-items:center}
.rs-logo i{width:10px;height:10px;background:var(--rs-orange);transform:skewX(-20deg)}
.rs-links{display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.3)}
.rs-links a{font-size:12px;color:#fff;text-decoration:none;padding:7px 16px;border-radius:99px}
.rs-links a:first-child{background:rgba(255,255,255,.28);font-weight:600}
.rs-right{display:flex;gap:8px;align-items:center}
.rs-enter{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:12px;font-weight:600}
.rs-slide{position:absolute;right:14%;top:36%;z-index:4;max-width:34vw}
.rs-slide.s1{left:8%;right:auto;top:30%}
.rs-slide h1{font-family:Archivo,sans-serif;font-weight:900;font-style:italic;font-size:clamp(44px,6.4vw,120px);line-height:.88;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 8px 40px rgba(80,0,60,.35)}
.rs-slide p{font-size:13px;margin:14px 0 18px;max-width:260px;opacity:.9}
.rs-cta{display:inline-block;background:#fff;color:#1b0f2e;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;text-decoration:none}
.rs-thumbs{position:absolute;left:50%;bottom:4vh;translate:-50% 0;display:flex;gap:10px;z-index:5;align-items:center}
.rs-thumbs i{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:linear-gradient(135deg,var(--rs-violet),var(--rs-magenta))}
.rs-thumbs i:nth-child(2){width:52px;height:52px;border-color:#fff;background:linear-gradient(135deg,var(--rs-orange),var(--rs-sky))}
.rs-count{position:absolute;right:4vw;bottom:5vh;width:110px;height:110px;z-index:5;display:grid;place-items:center;font-family:Archivo;font-weight:900;font-size:16px}
.rs-count::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,255,255,.7);animation:rs-ring 12s linear infinite}
@keyframes rs-ring{to{transform:rotate(360deg)}}
.next{min-height:60vh;display:grid;place-items:center;background:#1b0f2e;color:#fff;font-size:14px;letter-spacing:.2em}
@media (max-width:820px){.rs-links{display:none}.rs-slide,.rs-slide.s1{left:6%;right:6%;max-width:none;top:18%}.rs-portal{width:60vw;height:60vw}}
</style>
</head>
<body>
<section class="rs" data-hero data-scroll="300">
  <div class="hi-stage">
    <div class="hi-standin">
      <div class="rs-world">
        <div class="rs-cloud" style="left:12%;top:12%;width:120px;height:46px"></div>
        <div class="rs-cloud" style="left:70%;top:18%;width:90px;height:34px"></div>
        <div class="rs-floor"></div><div class="rs-speed"></div>
      </div>
      <div class="rs-portal"></div>
    </div>
    <video class="hi-video" data-hero-video data-mode="scrub" muted playsinline preload="auto" src=""></video>

    <nav class="rs-nav" data-in="drop" data-at="150" data-dur="900" data-ease="back">
      <div class="rs-logo"><i></i>Runshift</div>
      <div class="rs-links"><a href="#">Home</a><a href="#">Worlds</a><a href="#">Exploration</a><a href="#">Characters</a><a href="#">Journey</a><a href="#">Connect</a></div>
      <div class="rs-right"><span class="rs-enter">Enter</span><span>☰</span></div>
    </nav>

    <div class="rs-slide s1" data-scroll-range="0,0.45">
      <h1 data-in="letters" data-fx="slide-l" data-at="550" data-dur="700" data-stagger="35" data-ease="out">Endless Worlds</h1>
      <p data-in="fade-up" data-at="1150">Run through living cities, neon tracks and impossible deserts.</p>
      <a class="rs-cta" href="#" data-in="scale" data-ease="back" data-at="1350" data-dur="600">Explore Worlds</a>
    </div>
    <div class="rs-slide" data-scroll-range="0.45,1.01">
      <h1>Hero<br>Gear</h1>
      <p>Unlock powerful outfits and accessories to boost your runner's abilities.</p>
      <a class="rs-cta" href="#">View Gear</a>
    </div>

    <div class="rs-thumbs" data-in="fade-up" data-at="1500"><i></i><i></i><i></i><i></i></div>
    <div class="rs-count" data-in="scale" data-at="1600" data-dur="700">3.2M</div>
  </div>
</section>
<div class="next">NEXT SECTION</div>
<script src="hero-intro.js"></script>
</body>
</html>
