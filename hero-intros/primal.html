<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primal Hero · Hero Intro Template</title>
<meta name="description" content="Hero intro template: giant serif letters spelled one by one behind a scroll-scrubbed subject. Part of PURPLEROSA Hero Intros.">
<script>document.documentElement.classList.add('hi-js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero-intro.css">
<!--
  PRIMAL · "Spell the name, then step through it"
  Mode: SCRUB (scroll drives the clip). Auto intro 0 → 2.45s.
  Layer sandwich (back → front): plate video · giant letters · subject cut-out (alpha WebM) · UI
  Without an alpha cut-out, letters sit over the video with mix-blend-mode — see SKILL.md.
-->
<style>
:root{
  --pr-bg-1:#e9eef4; --pr-bg-2:#c5d0dd; --pr-navy:#1b2c4f; --pr-steel:#8c9bb0; --pr-cobalt:#2c4f9b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--pr-bg-2);color:var(--pr-navy)}
.pr .hi-stage{background:radial-gradient(70% 60% at 50% 45%,var(--pr-bg-1),var(--pr-bg-2))}
.pr-floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(to top,rgba(27,44,79,.12),transparent);z-index:0}
/* giant letters — sit BEHIND the subject */
.pr-word{position:absolute;left:0;right:0;top:50%;translate:0 -55%;z-index:1;display:flex;justify-content:center;
  font-family:'Bodoni Moda',serif;font-weight:400;font-size:19vw;line-height:1;letter-spacing:calc(-.01em + var(--p)*.25em);
  opacity:calc(1 - var(--p)*1.4);transform:scale(calc(1 + var(--p)*.25))}
.pr-word .hi-u{background:linear-gradient(180deg,var(--pr-navy) 10%,var(--pr-steel) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.has-video .pr-word{mix-blend-mode:multiply}
/* stand-in subject: porcelain orb with cobalt leopard rosettes */
.pr-subject{position:absolute;left:50%;top:53%;width:34vmin;height:44vmin;translate:-50% -50%;z-index:2;border-radius:46% 46% 40% 40%/50% 50% 45% 45%;
  background:radial-gradient(circle,var(--pr-cobalt) 0 22%,transparent 24%) 0 0/34px 30px,radial-gradient(circle,#6f8fd0 0 14%,transparent 16%) 17px 15px/34px 30px,
  radial-gradient(80% 80% at 40% 30%,#fff,#e6ebf3 70%,#c9d3e2);
  box-shadow:inset -20px -30px 60px rgba(27,44,79,.25),0 50px 70px -30px rgba(27,44,79,.45);
  transform:scale(calc(.85 + var(--p)*.9)) translateY(calc(var(--p)*-6vh))}
.hi-started .pr-subject{animation:pr-walk 2.4s cubic-bezier(.16,1,.3,1) both}
@keyframes pr-walk{from{opacity:0;filter:blur(10px);translate:-50% -42%}to{opacity:1;filter:none;translate:-50% -50%}}
.pr-top{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;z-index:4}
.pr-icons{display:flex;gap:22px;align-items:center;font-size:13px}
.pr-buy{background:#fff;padding:9px 16px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.04em;text-decoration:none;color:var(--pr-navy);box-shadow:0 4px 20px rgba(27,44,79,.1)}
.pr-explore{position:absolute;left:50%;bottom:9vh;translate:-50% 0;z-index:4;width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--pr-navy);text-decoration:none;box-shadow:0 10px 40px rgba(27,44,79,.18)}
.pr-explore::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(255,255,255,.8);animation:pr-ring 2.6s ease-out infinite}
@keyframes pr-ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.pr-tag{position:absolute;left:28px;bottom:9vh;z-index:4;font-size:13px;line-height:1.4;color:var(--pr-navy);opacity:.8}
.pr-thumbs{position:absolute;right:28px;top:42%;z-index:4;display:flex;flex-direction:column;gap:12px}
.pr-thumbs i{width:52px;height:64px;border-radius:14px;background:linear-gradient(160deg,#e9c6a6,#9a6a4e);box-shadow:0 8px 20px rgba(27,44,79,.2)}
.pr-dots{position:absolute;right:28px;bottom:9vh;z-index:4;display:flex;gap:8px}
.pr-dots i{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(27,44,79,.15)}
.pr-dots i:first-child{background:var(--pr-navy)}
.pr-panel{position:absolute;left:28px;top:24%;z-index:4;max-width:360px}
.pr-panel h2{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(32px,3.6vw,60px);line-height:1}
.pr-panel p{margin-top:14px;font-size:14px;opacity:.75}
.next{min-height:60vh;display:grid;place-items:center;background:var(--pr-navy);color:#fff;font-size:14px;letter-spacing:.2em}
@media (max-width:820px){.pr-word{font-size:24vw}.pr-thumbs{display:none}}
</style>
</head>
<body>
<section class="pr" data-hero data-scroll="260">
  <div class="hi-stage">
    <div class="pr-floor"></div>
    <!-- plate video (scrubbed by scroll). Encode with keyint=1 — see SKILL.md -->
    <video class="hi-video" data-hero-video data-mode="scrub" muted playsinline preload="auto" src=""></video>

    <div class="pr-word" data-in="letters" data-fx="letter-blur" data-at="250" data-dur="1000" data-stagger="190" data-ease="out">PRIMAL</div>

    <div class="hi-standin"><div class="pr-subject"></div></div>
    <!-- optional front layer: <video class="pr-cutout" src="cat-alpha.webm" …> scrubbed in sync -->

    <header class="pr-top" data-in="drop" data-at="1800" data-dur="800">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 14a8 8 0 0 1 16 0M5 14a5 5 0 0 1 10 0M8 14a2 2 0 0 1 4 0"/></svg>
      <div class="pr-icons"><span>⌕</span><span>◫</span><a class="pr-buy" href="#">BUY NOW</a></div>
    </header>

    <a class="pr-explore" href="#" data-in="scale" data-ease="back" data-at="1500" data-dur="800">EXPLORE</a>
    <div class="pr-tag" data-in="fade-up" data-at="2100">Unleash<br>your inner<br>beast.</div>
    <div class="pr-thumbs" data-in="slide-l" data-at="2200"><i></i><i></i></div>
    <div class="pr-dots" data-in="fade" data-at="2300"><i></i><i></i></div>

    <div class="pr-panel" data-scroll-range="0.55,1.01">
      <h2>The Porcelain Collection</h2>
      <p>Hand‑glazed cobalt rosettes on bone‑white gold. Twelve pieces, one wild idea.</p>
    </div>
  </div>
</section>
<div class="next">NEXT SECTION</div>
<script src="hero-intro.js"></script>
</body>
</html>
